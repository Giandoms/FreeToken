<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#f6f1e7"/>
  <rect x="0" y="0" width="12" height="420" fill="#ff6a13"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="70" y="70" font-size="22" letter-spacing="4" fill="#6b645a">CHI HA CREATO FREETOKEN</text>
    <circle cx="160" cy="215" r="88" fill="#141414"/>
    <circle cx="160" cy="215" r="74" fill="none" stroke="#ff6a13" stroke-width="5" stroke-dasharray="6 8"/>
    <text x="160" y="240" font-size="68" font-weight="900" text-anchor="middle" fill="#f6f1e7">GS</text>
    <text x="290" y="150" font-size="56" font-weight="900" fill="#141414" letter-spacing="-1">GIANDO SANTAMARIA</text>
    <rect x="292" y="164" width="590" height="16" fill="#ff6a13" opacity=".55"/>
    <text x="290" y="226" font-size="25" fill="#141414">Il primo in Italia a scrivere un libro su ChatGPT e a parlarne,</text>
    <text x="290" y="260" font-size="25" fill="#141414">quando ancora quasi nessuno lo faceva.</text>
    <text x="290" y="306" font-size="25" fill="#141414">La Rai lo ha definito il <tspan font-weight="800">«Facilitatore AI»</tspan>.</text>
    <text x="290" y="352" font-size="25" fill="#141414"><tspan font-weight="800">Presidente AI.MI</tspan>, il primo ente professionale che forma</text>
    <text x="290" y="386" font-size="25" fill="#141414">i futuri esperti di AI per PMI e pubblica amministrazione.</text>
  </g>
</svg>
